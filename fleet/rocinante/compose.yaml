name: rocinante

include:
  - ./common.yaml

services:
  dashboard:
    image: lissy93/dashy:latest
    env_file:
      - ./envs/common.env
    environment:
      - NODE_ENV=production
    volumes:
      - ./dashy/conf.yml:/app/user-data/conf.yml
    restart: unless-stopped

  bookmarks:
    image: ghcr.io/karakeep-app/karakeep:release
    env_file:
      - ./envs/common.env
      - ./envs/karakeep.env
    volumes:
      - karakeep_data:/data
    restart: unless-stopped

  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:release
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    restart: unless-stopped

  documents:
    image: triliumnext/trilium:latest
    env_file:
      - ./envs/common.env
    volumes:
      - trilium_data:/home/node/trilium-data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

volumes:
  karakeep_data:
  trilium_data: