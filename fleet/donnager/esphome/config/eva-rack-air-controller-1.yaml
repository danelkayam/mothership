esphome:
  name: eva-rack-air-controller-1
  friendly_name: EVA 1

  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(eva_status) = 0;

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

packages:
  network: !include common/network.yaml
  telemetry: !include common/telemetry.yaml

wifi:
  power_save_mode: none
  reboot_timeout: 5min  
  on_connect:
    then:
      - lambda: |-
          id(eva_status) = 1;
  on_disconnect:
    then:
      - lambda: |-
          id(eva_status) = 2;


# -----------------------------
# Buses
# -----------------------------

i2c:
  - id: bus_a
    sda: GPIO4
    scl: GPIO5
    scan: true

  - id: bus_b
    sda: GPIO6
    scl: GPIO7
    scan: true

spi:
  clk_pin: GPIO39
  mosi_pin: GPIO40

# -----------------------------
# Sensors
# -----------------------------

sensor:
  - platform: aht10
    variant: AHT20
    i2c_id: bus_a
    temperature:
      name: "Top Temperature"
      id: top_temp
      on_value:
        then:
          - lambda: |-
              id(top_temp_last_ok_ms) = millis();
    humidity:
      name: "Top Humidity"
      id: top_humidity
    update_interval: 10s

  - platform: aht10
    variant: AHT20
    i2c_id: bus_b
    temperature:
      name: "Bottom Temperature"
      id: bottom_temp
      on_value:
        then:
          - lambda: |-
              id(bottom_temp_last_ok_ms) = millis();
    humidity:
      name: "Bottom Humidity"
      id: bottom_humidity
    update_interval: 10s

  - platform: pulse_counter
    name: "Intake Fan RPM"
    id: fan_intake_rpm
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    filters:
      - multiply: 0.5
    update_interval: 5s

  - platform: pulse_counter
    name: "Exhaust Fan RPM"
    id: fan_exhaust_rpm
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
    filters:
      - multiply: 0.5
    update_interval: 5s

  - platform: template
    name: "Intake Fan Speed"
    id: fan_intake_speed
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      const float max_rpm = 1700.0;
      if (max_rpm <= 0.0) return 0;
      return (id(fan_intake_rpm).state / max_rpm) * 100.0;
    update_interval: 5s
    entity_category: diagnostic

  - platform: template
    name: "Exhaust Fan Speed"
    id: fan_exhaust_speed
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      const float max_rpm = 1700.0;
      if (max_rpm <= 0.0) return 0;
      return (id(fan_exhaust_rpm).state / max_rpm) * 100.0;
    update_interval: 5s
    entity_category: diagnostic

# -----------------------------
# Outputs
# -----------------------------

output:
  - platform: ledc
    id: fan_intake_pwm
    pin: GPIO15
    frequency: 25000Hz

  - platform: ledc
    id: fan_exhaust_pwm
    pin: GPIO16
    frequency: 25000Hz
  
  - platform: ledc
    id: tft_backlight
    pin: GPIO8
    frequency: 1000Hz

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status LED"
    pin: GPIO48
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
  
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: tft_backlight
    restore_mode: ALWAYS_ON

# -----------------------------
# Display
# -----------------------------

display:
  - platform: mipi_spi
    model: ST7789V
    cs_pin: GPIO41
    dc_pin: GPIO42
    reset_pin: GPIO21

    dimensions:
      width: 240
      height: 280
      offset_width: 0
      offset_height: 20

    rotation: 0°
    color_order: bgr
    invert_colors: true
    data_rate: 40MHz
    buffer_size: 25%
    update_interval: 1s

    lambda: |-
      const Color bg_color(0, 0, 0);
      const Color title_color(140, 140, 140);
      const Color text_color(200, 200, 200);
      const Color error_color(255, 80, 80);

      it.fill(bg_color);

      it.print(120, 10, id(eva_font_title), title_color, TextAlign::TOP_CENTER, "EVA-1");

      std::string wifi_bars = "    ";
      if (!isnan(id(wifi_signal_strength).state)) {
        const float rssi = id(wifi_signal_strength).state;
        if (rssi >= -55) {
          wifi_bars = "▂▄▆█";
        } else if (rssi >= -65) {
          wifi_bars = "▂▄▆ ";
        } else if (rssi >= -75) {
          wifi_bars = "▂▄  ";
        } else if (rssi >= -85) {
          wifi_bars = "▂   ";
        }
      }

      const int icon_x = 16;
      const int text_x = 44;
      const int value_x = 224;

      const int wifi_y = 48;
      const int top_y = 90;
      const int bottom_y = 132;
      const int intake_y = 186;
      const int exhaust_y = 228;

      const int icon_offset = 5;

      // WiFi
      it.printf(icon_x, wifi_y + icon_offset, id(eva_font_small), text_color, "\U000F05A9");
      it.printf(text_x, wifi_y, id(eva_font_small), text_color, "WiFi");
      it.printf(value_x, wifi_y, id(eva_font_small), text_color, TextAlign::TOP_RIGHT, "%s", wifi_bars.c_str());

      // Top temp
      it.printf(icon_x, top_y + icon_offset, id(eva_font_small), text_color, "\U000F050F");
      it.printf(text_x, top_y, id(eva_font_small), text_color, "Top");
      if (!isnan(id(top_temp).state)) {
        it.printf(value_x, top_y, id(eva_font_small), text_color, TextAlign::TOP_RIGHT, "%.1f°C", id(top_temp).state);
      } else {
        it.printf(value_x, top_y, id(eva_font_small), error_color, TextAlign::TOP_RIGHT, "--.-°C");
      }

      // Bottom temp
      it.printf(icon_x, bottom_y + icon_offset, id(eva_font_small), text_color, "\U000F050F");
      it.printf(text_x, bottom_y, id(eva_font_small), text_color, "Bottom");
      if (!isnan(id(bottom_temp).state)) {
        it.printf(value_x, bottom_y, id(eva_font_small), text_color, TextAlign::TOP_RIGHT, "%.1f°C", id(bottom_temp).state);
      } else {
        it.printf(value_x, bottom_y, id(eva_font_small), error_color, TextAlign::TOP_RIGHT, "--.-°C");
      }

      // Intake fan
      it.printf(icon_x, intake_y + icon_offset, id(eva_font_small), text_color, "\U000F0210");
      it.printf(text_x, intake_y, id(eva_font_small), text_color, "Intake");
      if (!isnan(id(fan_intake_rpm).state)) {
        it.printf(value_x, intake_y, id(eva_font_small), text_color, TextAlign::TOP_RIGHT, "%.0f RPM", id(fan_intake_rpm).state);
      } else {
        it.printf(value_x, intake_y, id(eva_font_small), error_color, TextAlign::TOP_RIGHT, "--- RPM");
      }

      // Exhaust fan
      it.printf(icon_x, exhaust_y + icon_offset, id(eva_font_small), text_color, "\U000F0210");
      it.printf(text_x, exhaust_y, id(eva_font_small), text_color, "Exhaust");
      if (!isnan(id(fan_exhaust_rpm).state)) {
        it.printf(value_x, exhaust_y, id(eva_font_small), text_color, TextAlign::TOP_RIGHT, "%.0f RPM", id(fan_exhaust_rpm).state);
      } else {
        it.printf(value_x, exhaust_y, id(eva_font_small), error_color, TextAlign::TOP_RIGHT, "--- RPM");
      }

# -----------------------------
# Scripts & functions
# -----------------------------

globals:
  # 0 - booting
  # 1 - wifi connected / operational
  # 2 - wifi disconnected
  # 3 - error
  - id: eva_status
    type: int
    restore_value: no
    initial_value: '0'

  - id: top_temp_last_ok_ms
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: bottom_temp_last_ok_ms
    type: unsigned long
    restore_value: no
    initial_value: '0'

interval:
  - interval: 10s
    then:
      - lambda: |-
          const float min_level = 0.2;
          const float max_level = 1.0;

          const float base_temp = 25.0;
          const float high_temp = 60.0;

          const unsigned long sensor_timeout_ms = 25000;
          const unsigned long now = millis();

          const float top = id(top_temp).state;
          const float bottom = id(bottom_temp).state;

          const bool top_fresh =
            id(top_temp_last_ok_ms) != 0 &&
            (now - id(top_temp_last_ok_ms) <= sensor_timeout_ms);

          const bool bottom_fresh =
            id(bottom_temp_last_ok_ms) != 0 &&
            (now - id(bottom_temp_last_ok_ms) <= sensor_timeout_ms);

          const bool top_ok = !isnan(top) && top_fresh;
          const bool bottom_ok = !isnan(bottom) && bottom_fresh;

          float control_temp = NAN;

          if (top_ok && bottom_ok) {
            control_temp = std::max(top, bottom);

          } else if (top_ok) {
            control_temp = top;

          } else if (bottom_ok) {
            control_temp = bottom;

          } else {
            // sets default speed and warn.
            id(fan_intake_pwm).set_level(min_level);
            id(fan_exhaust_pwm).set_level(min_level);

            id(eva_status) = 3;

            ESP_LOGW(
              "EVA",
              "Both temp sensors unavailable! using LOW fallback by policy: intake=%.0f%% exhaust=%.0f%%",
              min_level * 100,
              min_level * 100
            );
            return;
          }

          float intake_level = min_level + (control_temp - base_temp) / (high_temp - base_temp) * (max_level - min_level);
          
          // clamping
          if (intake_level < min_level) {
            intake_level = min_level;

          } else if (intake_level > max_level) {
            intake_level = max_level;
          }

          float exhaust_level = intake_level * 0.85;

          id(fan_intake_pwm).set_level(intake_level);
          id(fan_exhaust_pwm).set_level(exhaust_level);

          ESP_LOGI(
            "EVA",
            "top=%.2fC bottom=%.2fC control=%.2fC intake=%.0f%% exhaust=%.0f%%",
            top,
            bottom,
            control_temp,
            intake_level * 100,
            exhaust_level * 100
          );

  - interval: 5s
    then:
      - lambda: |-
          const unsigned long sensor_timeout_ms = 25000;
          const unsigned long now = millis();

          const float top = id(top_temp).state;
          const float bottom = id(bottom_temp).state;

          const bool top_ok =
            !isnan(top) &&
            id(top_temp_last_ok_ms) != 0 &&
            (now - id(top_temp_last_ok_ms) <= sensor_timeout_ms);

          const bool bottom_ok =
            !isnan(bottom) &&
            id(bottom_temp_last_ok_ms) != 0 &&
            (now - id(bottom_temp_last_ok_ms) <= sensor_timeout_ms);

          if (!top_ok && !bottom_ok) {
            id(eva_status) = 3;  // error
            return;
          }

          // clear error if sensors are back
          if (id(eva_status) == 3 && (top_ok || bottom_ok)) {
            // leave wifi status ownership to wifi callbacks if you want pure layering,
            // or restore to 1 only if you accept that simplification
            id(eva_status) = 1;
          }


  - interval: 1s
    then:
      - lambda: |-
          auto call = id(status_led).turn_on();
          call.set_brightness(0.20);

          switch (id(eva_status)) {
            case 0:  // booting
              call.set_rgb(0.0, 0.0, 1.0);  // blue
              break;

            case 1:  // operational
              call.set_rgb(0.0, 1.0, 0.0);    // green
              break;

            case 2:  // wifi disconnected
              call.set_rgb(1.0, 0.6, 0.0);  // yellow/amber
              break;

            case 3:  // error
            default:
              call.set_rgb(1.0, 0.0, 0.0);  // red
              break;
          }

          call.perform();

font:
  - file: "gfonts://Noto Sans Mono"
    id: eva_font_small
    size: 20
    bpp: 4
    glyphs: ' !"%()+=,-_.:/°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz▂▄▆█'
    extras:
      - file: "fonts/SymbolsNerdFontMono-Regular.ttf"
        glyphs:
          - "\U000F0210"  # fan
          - "\U000F050F"  # temp
          - "\U000F05A9"  # wifi

  - file: "gfonts://Noto Sans Mono"
    id: eva_font_title
    size: 24
    bpp: 4
    glyphs: ' !"%()+=,-_.:/°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz▂▄▆█'