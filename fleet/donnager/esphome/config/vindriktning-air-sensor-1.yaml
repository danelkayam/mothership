esphome:
  name: vindriktning-air-sensor-1
  friendly_name: vindriktning air sensor 1

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Vindriktning-Air-Sensor-1"
    password: !secret ap_password

captive_portal:

bluetooth_proxy:

uart:
  rx_pin: GPIO4
  baud_rate: 9600

sensor:
  - platform: pm1006
    pm_2_5:
      name: "Particulate Matter 2.5µm Concentration"
      filters:
        - sliding_window_moving_average:
            window_size: 20
            send_every: 20

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

binary_sensor:
  - platform: status
    name: "Status"

text_sensor:
  - platform: version
    name: "Version"