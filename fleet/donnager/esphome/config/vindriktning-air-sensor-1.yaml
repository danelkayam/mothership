esphome:
  name: vindriktning-air-sensor-1
  friendly_name: vindriktning air sensor 1

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

packages:
  network: !include common/network.yaml
  telemetry: !include common/telemetry.yaml

bluetooth_proxy:

uart:
  rx_pin: GPIO4
  baud_rate: 9600

sensor:
  - platform: pm1006
    pm_2_5:
      name: "Particulate Matter 2.5µm Concentration"
      filters:
        - sliding_window_moving_average:
            window_size: 20
            send_every: 20