name: donnager

include:
  - ./common.yaml

services:
  smart:
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host
    privileged: true
    env_file:
      - ./envs/common.env
    volumes:
      - homeassistant_data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - /mnt/media:/media:rw
    restart: unless-stopped
    depends_on:
      - mqtt

  esphome:
    image: ghcr.io/esphome/esphome:stable
    network_mode: host
    privileged: true
    env_file:
      - ./envs/common.env
    volumes:
      - esphome_data:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    depends_on:
      - smart

  mqtt:
    image: emqx/emqx:latest
    ports:
      - 1883:1883
    env_file:
      - ./envs/common.env
      - ./envs/mqtt.env
    environment:
      - EMQX_NODE__NAME=emqx@donnager
    volumes:
      - mqtt_data:/opt/emqx/data
      - mqtt_log:/opt/emqx/log
    restart: unless-stopped
  
  z2m:
    image: koenkk/zigbee2mqtt:latest
    env_file:
      - ./envs/common.env
    volumes:
      - z2m_data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    group_add:
      - dialout
    restart: unless-stopped
    depends_on:
      - mqtt

volumes:
  homeassistant_data:
  esphome_data:
  mqtt_data:
  mqtt_log:
  z2m_data:
