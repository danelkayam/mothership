name: betty

include:
  - ./common.yaml

services:
  blackhole:
    image: adguard/adguardhome:latest
    ports:
      # Initial setup
      - 3000:3000/tcp
      # Plain DNS
      - 53:53/tcp
      - 53:53/udp
      # DNS over TLS
      - 853:853/tcp
      # DNS over QUIC
      - 784:784/udp
      - 853:853/udp
      - 8853:8853/udp
      # DNSCrypt
      - 5443:5443/tcp
      - 5443:5443/udp
    env_file:
      - ./envs/common.env
    volumes:
      - blackhole_workdir:/opt/adguardhome/work
      - blackhole_confdir:/opt/adguardhome/conf
    restart: unless-stopped

volumes:
  blackhole_workdir:
  blackhole_confdir: