name: donnager

include:
  - ./common.yaml

services:
  smart:
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host
    privileged: true
    env_file:
      - ./envs/common.env
    volumes:
      - homeassistant_data:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped

  esphome:
    image: ghcr.io/esphome/esphome:stable
    network_mode: host
    privileged: true
    env_file:
      - ./envs/common.env
    volumes:
      - esphome_data:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  z2m:
    image: koenkk/zigbee2mqtt:latest
    env_file:
      - ./envs/common.env
    volumes:
      - z2m_data:/app/data
      - /run/udev:/run/udev:ro
    group_add:
      - dialout
    restart: unless-stopped

volumes:
  homeassistant_data:
  z2m_data:
  esphome_data:
