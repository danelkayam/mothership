
services:
  # proxy server for routing all inner services
  reverse-proxy:
    image: caddy:2.8-alpine
    depends_on:
      - blackhole
      - smart
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    env_file:
      - ./secrets/reverse-proxy.env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/proxy/config:/config
      - ./data/proxy/data:/data
    restart: unless-stopped

  # local dns for manage mothership.home domain and block ads
  blackhole:
    image: pihole/pihole:latest
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 67:67/udp
    env_file:
      - ./secrets/common.env
      - ./secrets/blackhole.env
    volumes:
      - ./data/blackhole/pihole/:/etc/pihole
      - ./data/blackhole/dnsmasq/:/etc/dnsmasq.d
    restart: unless-stopped

  # home page for all services
  deck:
    image: lscr.io/linuxserver/heimdall:latest
    env_file:
      - ./secrets/common.env
    volumes:
      - ./data/deck:/config
    restart: unless-stopped

  ############################################################
  #
  # Smart Home
  #
  ############################################################

  # manages automation and control of all iot devices
  smart:
    image: homeassistant/home-assistant:stable
    depends_on:
      - mqtt
    network_mode: host
    privileged: true
    env_file:
      - ./secrets/common.env
      - ./secrets/smart.env
    volumes:
      - ./data/smart:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped

  mqtt:
    build:
      context: ./mqtt
    ports:
      - 1883:1883
      - 9001:9001
    env_file:
      - ./secrets/mqtt.env
    volumes:
      - ./data/mqtt/data:/mosquitto/data
      - ./data/mqtt/log:/mosquitto/log
    restart: unless-stopped

  # bridges zigbee devices to mqtt
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.42.0
    env_file:
      - ./secrets/common.env
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      # Make sure this matched your adapter location
      - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_429e93520ed9eb11939a0815b9da5f8b-if00-port0:/dev/ttyACM0
    group_add:
      - dialout
    restart: unless-stopped

  # manages all esp devices
  esphome:
    image: esphome/esphome
    network_mode: host
    privileged: true
    volumes:
      - ./data/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  ############################################################
  #
  # Media Servers
  #
  ############################################################

  # manages torrent downloads
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    ports:
      - 51413:51413
      - 51413:51413/udp
    env_file:
      - ./secrets/common.env
      - ./secrets/transmission.env
    volumes:
      - ./data/transmission:/config
      - /media/data/downloads:/downloads:rw
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    env_file:
      - ./secrets/common.env
    volumes:
      - ./data/radarr:/config
      - /media/data/movies:/movies:rw
      - /media/data/downloads:/downloads:rw
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    env_file:
      - ./secrets/common.env
    volumes:
      - ./data/sonarr:/config
      - /media/data/shows:/tv:rw
      - /media/data/downloads:/downloads:rw
    restart: unless-stopped

  prowlarr:
    image: ghcr.io/linuxserver/prowlarr:develop
    env_file:
      - ./secrets/common.env
    volumes:
      - ./data/prowlarr:/config
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    env_file:
      - ./secrets/common.env
    volumes:
      - ./data/bazarr/config:/config
      - /media/data/movies:/movies:rw
      - /media/data/shows:/tv:rw
    restart: unless-stopped

  ############################################################
  #
  # Miscellaneous
  #
  ############################################################

  # vscode for editing configurations
  code:
    image: lscr.io/linuxserver/code-server:latest
    env_file:
      - ./secrets/common.env
      - ./secrets/code.env
    volumes:
      - ./data/code:/config
      - ./data:/config/workspace
    restart: unless-stopped

  files:
    image: filebrowser/filebrowser:s6
    env_file:
      - ./secrets/common.env
    volumes:
      - ./data/files:/database
      - /media/data:/srv:rw
    restart: unless-stopped

  # view dockers logs
  dozzle:
    image: amir20/dozzle:latest
    ports:
      - 3002:8080
    env_file:
      - ./secrets/dozzle.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # system monitor
  beszel:
    image: henrygd/beszel:latest
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data/beszel:/beszel_data
    restart: unless-stopped

  beszel-agent:
    image: "henrygd/beszel-agent"
    network_mode: host
    env_file:
      - ./secrets/beszel-agent.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped